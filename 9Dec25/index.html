<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modern Login Page</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="floating-circles">
    <span></span>
    <span></span>
    <span></span>
  </div>

  <div class="login-card">
    <div class="app-logo" >
      <img src="logo.png" alt="App Logo" >
    </div>
    <h2>Welcome Back ✨</h2>

    <div class="input-box">
      <label for="email">Email</label>
      <input id="email" type="email" name="email" placeholder="Enter your email" autocomplete="off" />
    </div>

    <div class="input-box" style="position: relative;">
      <label>Password</label>
      <input id="password" type="password" placeholder="Enter your password" />
      <span id="togglePassword" >
        <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" fill="#fff" viewBox="0 0 24 24" width="22" height="22">
          <path d="M12 5c-7 0-11 7-11 7s4 7 11 7 11-7 11-7-4-7-11-7zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/>
        </svg>
        <svg id="eyeOffIcon" xmlns="http://www.w3.org/2000/svg" fill="#fff" viewBox="0 0 24 24" width="22" height="22" style="display:none;">
          <path d="M12 5c-7 0-11 7-11 7a21.8 21.8 0 0 0 4.2 5.2l-2.1 2.1 1.4 1.4 18-18-1.4-1.4-3.3 3.3C16.4 6.2 14.3 5 12 5zm0 12a5 5 0 0 1-5-5c0-.9.2-1.7.6-2.4l6.8 6.8A4.9 4.9 0 0 1 12 17z"/>
        </svg>
      </span>
    </div>

    <button class="login-btn">Login</button>

    <div class="links">
      <a href="#">Forgot Password?</a>
      <a href="#">Create Account</a>
    </div>
  </div>

  <script>
    const pass = document.getElementById('password');
    const toggle = document.getElementById('togglePassword');

    toggle.addEventListener('click', () => {
      const type = pass.getAttribute('type') === 'password' ? 'text' : 'password';
      pass.setAttribute('type', type);
      if (type === 'password') {
        document.getElementById('eyeIcon').style.display = 'block';
        document.getElementById('eyeOffIcon').style.display = 'none';
      } else {
        document.getElementById('eyeIcon').style.display = 'none';
        document.getElementById('eyeOffIcon').style.display = 'block';
      }
    });
  </script>
</body>
</html>
