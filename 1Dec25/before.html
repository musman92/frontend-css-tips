<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body {
      background: #0d0d0d;
      display: flex;
      justify-content: center;
      padding: 40px;
      font-family: sans-serif;
    }

    .product-card-basic {
      width: 250px;
      background: #111;
      border: 1px solid #ccc;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      color: #fff;
    }

    .product-card-basic img {
      width: 100%;
      border-radius: 4px;
      border: 1px solid #444;
    }

    .product-card-basic button {
      margin-top: 10px;
      padding: 10px 15px;
      background: #333;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="product-card-basic">
    <img src="https://prd.place/250?id=14" alt="Product">
    <h3>Wireless Headphones</h3>
    <p>$59.99</p>
    <button>Add to Cart</button>
  </div>
</body>
</html>
