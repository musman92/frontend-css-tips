<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    .social2 {
      display: flex;
      gap: 15px;
    }

    .icon-box {
      background: #222;
      color: white;
      width: 60px;
      height: 70px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      gap: 12px;
      cursor: pointer;
      transition: .35s ease;
      font-size: 26px;
      position: relative;
      padding-left: 10px;
    }

    /* Text */
    .icon-box span {
      opacity: 0;
      transform: translateX(-20px);
      transition: .35s cubic-bezier(.25,1.4,.5,1);
      white-space: nowrap;
      font-size: 17px;
      font-weight: 500;
    }

    /* Expand but keep icon dominant */
    .icon-box:hover {
      width: 120px; /* icon ~70px > 50% */
      justify-content: flex-start;
      padding-left: 15px;
    }

    /* Show text */
    .icon-box:hover span {
      opacity: 1;
      transform: translateX(0);
    }

    /* Brand Colors */
    .facebook:hover { background: #1877f2; }
    .instagram:hover { background: radial-gradient(circle at 30% 30%, #fdf497, #fd5949, #d6249f, #285AEB); }
    .youtube:hover { background: #ff0000; }
    .linkedin:hover { background: #0a66c2; }
    .github:hover { background: #171515; }

  </style>
</head>
<body>
  <div class="social2">
    <div class="icon-box facebook">
      <i class="fab fa-facebook-f"></i>
      <span>Facebook</span>
    </div>

    <div class="icon-box instagram">
      <i class="fab fa-instagram"></i>
      <span>Instagram</span>
    </div>

    <div class="icon-box youtube">
      <i class="fab fa-youtube"></i>
      <span>YouTube</span>
    </div>

    <div class="icon-box linkedin">
      <i class="fab fa-linkedin-in"></i>
      <span>LinkedIn</span>
    </div>

    <div class="icon-box github">
      <i class="fab fa-github"></i>
      <span>GitHub</span>
    </div>
  </div>

</body>
</html>
