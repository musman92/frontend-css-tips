<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box Model</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
        }
        p {
            width: 300px;
            height: 300px;
            border: 20px solid #c6c6c6;
            padding: 20px;
            margin: 20px;
        }
    </style>
</head>
<body>
    <p>Usman | Tech & AI</p>
</body>
</html>
