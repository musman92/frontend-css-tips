<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Before After Slider</title>

<style>
  body {
    background: #020617;
    min-height: 100vh;
    display: grid;
    place-items: center;
    margin: 0;
    font-family: system-ui, sans-serif;
  }

  .container {
    position: relative;
    width: min(800px, 90%);
    aspect-ratio: 16 / 9;
    overflow: hidden;
    border-radius: 16px;
  }

  img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .after {
    clip-path: inset(0 0 0 50%);
  }

  input[type="range"] {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    appearance: none;
    background: transparent;
    cursor: ew-resize;
    z-index: 10;
  }

  /* Range thumb (handle) */
  input[type="range"]::-webkit-slider-thumb {
    appearance: none;
    width: 44px;
    height: 44px;
    background: white;
    border-radius: 50%;
    box-shadow: 0 4px 12px rgba(0,0,0,.4);
  }

  input[type="range"]::-moz-range-thumb {
    width: 44px;
    height: 44px;
    background: white;
    border-radius: 50%;
    border: none;
  }

  /* Divider line */
  .line {
    position: absolute;
    top: 0;
    left: 50%;
    width: 2px;
    height: 100%;
    background: white;
    z-index: 5;
    pointer-events: none;
  }

  .label {
    position: absolute;
    top: 16px;
    padding: 6px 12px;
    background: rgba(0,0,0,.6);
    color: white;
    border-radius: 999px;
    font-size: 14px;
    z-index: 20;
  }

  .before { left: 16px; }
  .after-label { right: 16px; }
</style>
</head>
<body>

<div class="container">
  <span class="label before">Before</span>
  <span class="label after-label">After</span>

  <img src="before.jpg">
  <img class="after" src="after.jpg">

  <div class="line"></div>
  <input type="range" min="0" max="100" value="50">
</div>

<script>
  const range = document.querySelector("input");
  const afterImg = document.querySelector(".after");
  const line = document.querySelector(".line");

  range.addEventListener("input", (e) => {
    const value = e.target.value;
    afterImg.style.clipPath = `inset(0 0 0 ${value}%)`;
    line.style.left = `${value}%`;
  });
</script>

</body>
</html>
