<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CSS aspect-ratio Demo</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    padding: 40px;
  }

  h2 {
    margin-bottom: 10px;
  }

  .wrapper {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 30px;
  }

  .card {
    background: white;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 10px 20px rgba(0,0,0,0.1);
  }

  /* ❌ Without aspect-ratio */
  .image-broken {
    width: 100%;
    height: 200px;
    /* background: url("https://picsum.photos/800/600") center/cover no-repeat; */
    background: url("https://images.unsplash.com/photo-1512453979798-5ea266f8880c") center/cover no-repeat;
  }

  /* ✅ With aspect-ratio */
  .image-fixed {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: url("https://images.unsplash.com/photo-1512453979798-5ea266f8880c") center/cover no-repeat;
  }

  .content {
    padding: 15px;
  }

  .label {
    padding: 8px 12px;
    font-size: 14px;
    font-weight: bold;
  }

  .bad {
    background: #ffdddd;
    color: #a30000;
  }

  .good {
    background: #ddffea;
    color: #007a3d;
  }
</style>
</head>

<body>

<h2>Resize the screen 👇</h2>

<div class="wrapper">

  <div class="card">
    <div class="label bad">❌ Without aspect-ratio</div>
    <div class="image-broken"></div>
    <div class="content">
      Image height is fixed — layout breaks on resize
    </div>
  </div>

  <div class="card">
    <div class="label good">✅ With aspect-ratio</div>
    <div class="image-fixed"></div>
    <div class="content">
      Aspect ratio stays perfect on all screens
    </div>
  </div>

</div>

</body>
</html>
