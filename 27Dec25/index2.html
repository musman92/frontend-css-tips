<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CSS aspect-ratio Demo</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    padding: 40px;
  }

  .wrapper {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 30px;
  }

  .card {
    background: white;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 10px 20px rgba(0,0,0,0.1);
  }
  .content {
    padding: 15px;
  }

  .image {
    width: 100%;
    /* height: 200px; */
    aspect-ratio: 16/9;
    background: url("https://images.unsplash.com/photo-1512453979798-5ea266f8880c") center/cover no-repeat;
  }
</style>
</head>

<body>

<div class="wrapper">

  <div class="card">
    <div class="image"></div>
    <div class="content">
      Image height is fixed — layout breaks on resize
    </div>
  </div>

</div>

</body>
</html>
