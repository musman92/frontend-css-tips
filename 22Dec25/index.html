<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CSS Units Explained Visually</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, sans-serif;
    }

    body {
      padding: 20px;
      background: #f7f7f7;
    }

    h1 {
      margin-bottom: 5px;
    }

    .hint {
      color: #555;
      margin-bottom: 20px;
    }

    .controls {
      margin-bottom: 20px;
      background: #fff;
      padding: 12px;
      border-radius: 8px;
      width: fit-content;
    }

    .parent {
      width: 70%;
      background: #fff;
      border: 2px dashed #bbb;
      padding: 20px;
      border-radius: 10px;
    }

    .box {
      height: 56px;
      margin: 14px 0;
      color: white;
      display: flex;
      align-items: center;
      padding-left: 12px;
      font-weight: 600;
      border-radius: 6px;
      transition: width 0.3s ease;
    }

    .px {
      width: 150px;
      background: #e74c3c;
    }

    .percent {
      width: 50%;
      background: #3498db;
    }

    /* REM SCOPE */
    .rem-scope {
      font-size: 16px;
      border: 1px dashed #2ecc71;
      padding: 6px;
      border-radius: 6px;
      width: 20rem;
    }

    .rem {
      width: 10rem;
      background: #2ecc71;
    }

    .em-scope {
        font-size: 20px;
        margin: 10px 0;
    }
    .em {
      font-size: 1.5em;
      background: #2ecc71;
    }

    .vh {
      width: 20vh;
      background: #9b59b6;
    }
    .vw {
      width: 30vw;
      background: #f39c12;
    }
  </style>
</head>

<body>

  <h1>CSS Units Explained Visually</h1>
  <p class="hint">Only <b>rem</b> reacts to the slider 👇</p>

  <div class="controls">
    <label>
      Simulated root font-size:
      <input type="range" min="10" max="30" value="16" id="remSize">
      <span id="remValue">16px</span>
    </label>
  </div>

  <div class="parent">
    <div class="box px">px (150px)</div>
    <div class="box percent">% (50%)</div>

    <div class="rem-scope">
      <div class="box rem">rem (10rem)</div>
    </div>
    
    <div class="em-scope">
        <div class="" style="background-color: #9b59b6; padding: 5px;border-radius: 6px; padding: 5px;">Normal Text 20px</div>
        <div class="box em">em (10em)</div>
    </div>
    <div class="box vw">vw (30vw)</div>
    <div class="box vh">vh (20vh)</div>
  </div>

  <script>
    const slider = document.getElementById("remSize");
    const value = document.getElementById("remValue");
    const remScope = document.querySelector(".rem-scope");

    slider.addEventListener("input", () => {
      remScope.style.fontSize = slider.value + "px";
      value.textContent = slider.value + "px";
      document.documentElement.style.fontSize = slider.value + "px";
    });
  </script>

</body>
</html>
