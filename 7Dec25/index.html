<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Team Slider</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="carousel-section">
    <div class="carousel-container">

      <div class="carousel">
        <div class="item">
          <img src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80">
          <div class="info">
            <h3>Sarah Johnson</h3>
            <p>Creative Director</p>
          </div>
        </div>

        <div class="item">
          <img src="https://plus.unsplash.com/premium_photo-1688350808212-4e6908a03925">
          <div class="info">
            <h3>Aisha Khan</h3>
            <p>Brand Strategist</p>
          </div>
        </div>

        <div class="item">
          <img src="https://images.unsplash.com/photo-1527980965255-d3b416303d12">
          <div class="info">
            <h3>David Wilson</h3>
            <p>Senior Developer</p>
          </div>
        </div>

        <div class="item">
          <img src="https://plus.unsplash.com/premium_photo-1663047504447-d54e624ef2d5">
          <div class="info">
            <h3>Amelia Lee</h3>
            <p>Product Manager</p>
          </div>
        </div>

        <div class="item">
          <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d">
          <div class="info">
            <h3>John Carter</h3>
            <p>UI/UX Designer</p>
          </div>
        </div>
      </div>

      <!-- Progress Bar -->
      <div class="progress-bar">
        <div class="progress"></div>
      </div>

      <!-- Bottom Center Arrows -->
      <div class="bottom-controls">
        <button class="nav-btn left-btn">&#10094;</button>
        <button class="nav-btn right-btn">&#10095;</button>
      </div>
    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>
