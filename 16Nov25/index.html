<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
    }

    .blob {
      width: 300px;
      height: 300px;
      background: linear-gradient(135deg, #ff6ec4, #7873f5);
      animation: morph 8s ease-in-out infinite;
      border-radius: 30%;
      filter: drop-shadow(0 0 30px #ff6ec4);
    }

    @keyframes morph {
      0% {
        border-radius: 40% 60% 70% 30% / 30% 40% 60% 70%;
        transform: translate(0, 0);
      }
      25% {
        border-radius: 60% 30% 50% 70% / 60% 50% 40% 30%;
        transform: translate(20px, -20px);
      }
      50% {
        border-radius: 30% 70% 40% 60% / 40% 30% 70% 60%;
        transform: translate(-30px, 10px);
      }
      75% {
        border-radius: 50% 60% 30% 40% / 70% 60% 40% 30%;
        transform: translate(10px, 30px);
      }
      100% {
        border-radius: 40% 60% 70% 30% / 30% 40% 60% 70%;
        transform: translate(0, 0);
      }
    }
  </style>
</head>
<body>
  <div class="blob"></div>
</body>
</html>
